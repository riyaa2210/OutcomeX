################################################################################
# render.yaml — MeetTrack full-stack deployment on Render
#
# Before deploying:
#   1. Create a PostgreSQL 16 database on Render (enable pgvector extension)
#   2. Create a Redis instance on Render
#   3. Fill in all "sync: false" env vars in the Render dashboard
#   4. Push this repo to GitHub, connect it to Render via Blueprint
#
# Required env vars (set in Render dashboard, NOT here):
#   DATABASE_URL   — Render PostgreSQL internal URL
#   SECRET_KEY     — auto-generated by Render (generateValue: true)
#   GEMINI_API_KEY — your Google AI Studio key
#   REDIS_URL      — Render Redis internal URL
#   CORS_ORIGINS   — comma-separated: https://your-frontend.onrender.com
#   FRONTEND_URL   — https://your-frontend.onrender.com
#   BACKEND_URL    — https://your-backend.onrender.com
#   VITE_API_BASE_URL — https://your-backend.onrender.com  (frontend build)
################################################################################

services:

  # ── Backend (FastAPI) ──────────────────────────────────────────────────────
  - type: web
    name: meettrack-backend
    runtime: python
    rootDir: MeetTrack-main
    region: oregon
    plan: starter
    buildCommand: >
      pip install -r requirements.txt &&
      python -m spacy download en_core_web_sm
    startCommand: >
      uvicorn backend.app.main:app
      --host 0.0.0.0
      --port $PORT
      --workers 2
      --log-level info
    healthCheckPath: /health
    envVars:
      # ── Required ────────────────────────────────────────────
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false          # e.g. https://meettrack-frontend.onrender.com
      - key: FRONTEND_URL
        sync: false
      - key: BACKEND_URL
        sync: false

      # ── Transcription (choose one) ──────────────────────────
      # Option A: local whisper on the Render instance (no GPU, CPU only)
      - key: USE_LOCAL_WHISPER
        value: "false"       # true = local CPU whisper, false = Colab API
      - key: WHISPER_MODEL_SIZE
        value: "base"
      # Option B: Colab Whisper API
      - key: COLAB_API_URL
        sync: false
      - key: USE_AWS_TRANSCRIBE
        value: "false"

      # ── AI ──────────────────────────────────────────────────
      - key: OPENAI_API_KEY
        sync: false          # optional — enables GPT-4o fallback
      - key: LLM_CACHE_ENABLED
        value: "true"
      - key: LLM_CACHE_TTL
        value: "3600"

      # ── AWS (optional) ──────────────────────────────────────
      - key: AWS_REGION
        value: "ap-south-1"
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: TRANSCRIBE_BUCKET
        sync: false
      - key: SNS_TOPIC_ARN
        sync: false

      # ── Auth token lifetimes ────────────────────────────────
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"

      # ── Automation (optional) ───────────────────────────────
      - key: ACTIVEPIECES_WEBHOOK_URL
        sync: false
      - key: ACTIVEPIECES_SECRET
        sync: false

  # ── Celery Worker ──────────────────────────────────────────────────────────
  - type: worker
    name: meettrack-celery-worker
    runtime: python
    rootDir: MeetTrack-main
    region: oregon
    plan: starter
    buildCommand: >
      pip install -r requirements.txt &&
      python -m spacy download en_core_web_sm
    startCommand: >
      celery -A backend.worker.celery_app worker
      -Q transcription,ai_extraction,email_delivery,analytics,webhooks
      --loglevel=info
      --concurrency=2
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: USE_LOCAL_WHISPER
        value: "false"
      - key: COLAB_API_URL
        sync: false
      - key: AWS_REGION
        value: "ap-south-1"
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: SNS_TOPIC_ARN
        sync: false
      - key: ACTIVEPIECES_WEBHOOK_URL
        sync: false
      - key: ACTIVEPIECES_SECRET
        sync: false

  # ── Celery Beat (periodic scheduler) ──────────────────────────────────────
  - type: worker
    name: meettrack-celery-beat
    runtime: python
    rootDir: MeetTrack-main
    region: oregon
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A backend.worker.celery_app beat --loglevel=info
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  # ── Flower (Celery monitoring UI) ──────────────────────────────────────────
  - type: web
    name: meettrack-flower
    runtime: python
    rootDir: MeetTrack-main
    region: oregon
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: >
      celery -A backend.worker.celery_app flower
      --port=$PORT
      --basic_auth=${FLOWER_USER}:${FLOWER_PASSWORD}
    envVars:
      - key: REDIS_URL
        sync: false
      - key: FLOWER_USER
        value: admin
      - key: FLOWER_PASSWORD
        generateValue: true

  # ── Frontend (React / Vite static site) ───────────────────────────────────
  - type: web
    name: meettrack-frontend
    runtime: static
    rootDir: MeetTrack-main/frontend
    region: oregon
    plan: starter
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # Must point to your deployed backend URL
      - key: VITE_API_BASE_URL
        sync: false          # e.g. https://meettrack-backend.onrender.com
      - key: VITE_API_TIMEOUT
        value: "30000"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
